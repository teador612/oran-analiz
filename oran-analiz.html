<!-- GÜNÜN MAÇLARI -->
<section id="todaySection" class="section">

  <div class="section-title">
    <h2>Günün Maçları</h2>
  </div>

  <div class="notice">
    <strong>Günün Maçları</strong>
    <br><br>

    Seçtiğin tarihteki oynanmamış maçlar gösterilir.
    <br><br>

    Her maçın <strong>+</strong> butonundan, açılış oranlarıyla geçmişte
    eşleşen <strong>tüm maçların</strong> sonuç yüzdelerini görebilirsin.
    <br><br>

    Bu bölümde <strong>başarı yüzdesi için herhangi bir alt sınır uygulanmaz.</strong>
    <br>

    <strong>1.40 minimum oran filtresi uygulanmaz.</strong>
  </div>

  <!-- TARİH SEÇİMİ -->
  <div class="today-date-box">
    <label for="todayDate">
      <strong>Maç günü seç</strong>
    </label>

    <input
      type="date"
      id="todayDate"
      autocomplete="off"
    >
  </div>

  <!-- İSTATİSTİK -->
  <div id="todayStats" class="stats"></div>

  <!-- MAÇLAR -->
  <div id="todayMatches"></div>

</section>

<script>
/* =========================================================
   BUGÜNÜN MAÇLARI
   ========================================================= */

const TODAY_MARKETS = [
  {
    key: 'ms1',
    label: 'MS1',
    target: '1',
    css: 'today-ms1'
  },
  {
    key: 'ms0',
    label: 'MS0 / Beraberlik',
    target: 'X',
    css: 'today-ms0'
  },
  {
    key: 'ms2',
    label: 'MS2',
    target: '2',
    css: 'today-ms2'
  },
  {
    key: 'kgVar',
    label: 'KG Var',
    target: 'VAR',
    css: 'today-kg'
  },
  {
    key: 'over25',
    label: '2,5 Üst',
    target: 'ÜST',
    css: 'today-over'
  },
  {
    key: 'iyOver15',
    label: 'İY 1,5 Üst',
    target: 'ÜST',
    css: 'today-iy15'
  },
  {
    key: 'iyOver05',
    label: 'İY 0,5 Üst',
    target: 'ÜST',
    css: 'today-iy05'
  }
];


/* =========================================================
   SEÇİLİ TARİH
   ========================================================= */

function getSelectedTodayDate() {
  const input = document.getElementById('todayDate');

  if (!input) {
    return localTodayISO();
  }

  if (!input.value) {
    input.value = localTodayISO();
  }

  return input.value;
}


/* =========================================================
   TARİH SEÇİMİ
   ========================================================= */

function initTodayDatePicker() {
  const input = document.getElementById('todayDate');

  if (!input) return;

  input.value = localTodayISO();

  input.addEventListener('change', function () {
    renderToday();
  });
}


/* =========================================================
   AYNI AÇILIŞ ORANINA SAHİP GEÇMİŞ MAÇLAR
   ========================================================= */

function todayHistoryByOdd(match, marketKey) {

  const odd = getOdd(match, marketKey);

  if (!Number.isFinite(odd)) {
    return [];
  }

  return DATA.filter(row => {

    const score = getScore(row);

    if (!score) {
      return false;
    }

    const historicalOdd = getOdd(row, marketKey);

    if (!Number.isFinite(historicalOdd)) {
      return false;
    }

    return historicalOdd === odd;
  });
}


/* =========================================================
   GÜNÜN MAÇI İÇİN İSTATİSTİKLER
   ========================================================= */

function todayRecommendations(match) {

  const recommendations = [];

  TODAY_MARKETS.forEach(market => {

    const odd = getOdd(match, market.key);

    if (!Number.isFinite(odd)) {
      return;
    }

    const history = todayHistoryByOdd(match, market.key);

    if (!history.length) {
      return;
    }

    const success = history.filter(row => {
      return getResult(row, market.key) === market.target;
    }).length;

    const total = history.length;

    const rate = total > 0
      ? (success / total) * 100
      : 0;

    recommendations.push({
      key: market.key,
      label: market.label,
      target: market.target,
      css: market.css,
      odd,
      success,
      total,
      rate,
      history
    });
  });

  /*
   * SADECE SIRALAMA VAR.
   *
   * BURADA %70 FİLTRESİ YOKTUR.
   */
  recommendations.sort((a, b) => b.rate - a.rate);

  return recommendations;
}


/* =========================================================
   YÜZDE FORMAT
   ========================================================= */

function formatTodayRate(rate) {

  if (!Number.isFinite(rate)) {
    return '0%';
  }

  return rate.toFixed(1).replace('.0', '') + '%';
}


/* =========================================================
   TARİH FORMAT
   ========================================================= */

function formatTodayDate(date) {

  if (!date) {
    return '';
  }

  const parts = date.split('-');

  if (parts.length !== 3) {
    return date;
  }

  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}


/* =========================================================
   BUGÜNÜN MAÇLARINI RENDER
   ========================================================= */

function renderToday() {

  const matchesContainer = document.getElementById('todayMatches');
  const statsContainer = document.getElementById('todayStats');

  if (!matchesContainer) {
    return;
  }

  const selectedDate = getSelectedTodayDate();

  const rows = DATA.filter(row => {

    const rowDate = getDate(row);
    const score = getScore(row);

    return rowDate === selectedDate && !score;
  });


  /* -------------------------------------------------------
     İSTATİSTİKLER
     ------------------------------------------------------- */

  let totalRecommendations = 0;
  let matchesWithStatistics = 0;

  rows.forEach(match => {

    const recommendations = todayRecommendations(match);

    if (recommendations.length > 0) {
      matchesWithStatistics++;
      totalRecommendations += recommendations.length;
    }
  });


  if (statsContainer) {

    statsContainer.innerHTML = `
      <div class="stat-box">
        <strong>${formatTodayDate(selectedDate)}</strong>
        <span>${rows.length} maç</span>
      </div>

      <div class="stat-box">
        <strong>${matchesWithStatistics}</strong>
        <span>istatistik bulunan maç</span>
      </div>

      <div class="stat-box">
        <strong>${totalRecommendations}</strong>
        <span>sonuç istatistiği</span>
      </div>
    `;
  }


  /* -------------------------------------------------------
     MAÇ YOK
     ------------------------------------------------------- */

  if (!rows.length) {

    matchesContainer.innerHTML = `
      <div class="empty-state">
        <strong>${formatTodayDate(selectedDate)}</strong>
        tarihinde oynanmamış maç bulunamadı.
      </div>
    `;

    return;
  }


  /* -------------------------------------------------------
     MAÇLARI OLUŞTUR
     ------------------------------------------------------- */

  matchesContainer.innerHTML = rows.map((match, index) => {

    const recommendations = todayRecommendations(match);

    const home = getHome(match) || '-';
    const away = getAway(match) || '-';

    const matchId = `today-match-${index}`;


    const recommendationHtml = recommendations.length
      ? recommendations.map((item, recIndex) => {

          const detailId =
            `${matchId}-history-${recIndex}`;

          return `
            <div class="today-result ${item.css}">

              <div class="today-result-main">

                <span class="today-result-label">
                  ${item.label}
                </span>

                <strong>
                  %${formatTodayRate(item.rate)}
                </strong>

                <span>
                  ${item.success}/${item.total}
                </span>

                <span>
                  oran ${item.odd}
                </span>

                <button
                  type="button"
                  class="today-plus"
                  onclick="toggleTodayHistory('${detailId}', this)"
                  aria-expanded="false"
                >
                  +
                </button>

              </div>

              <div
                id="${detailId}"
                class="today-history"
                style="display:none;"
              >

                ${
                  item.history.length
                    ? item.history.map(historyRow => {

                        const historyDate =
                          formatTodayDate(getDate(historyRow));

                        const historyHome =
                          getHome(historyRow) || '-';

                        const historyAway =
                          getAway(historyRow) || '-';

                        const historyScore =
                          getScore(historyRow) || '-';

                        const result =
                          getResult(historyRow, item.key) || '-';

                        return `
                          <div class="today-history-row">

                            <span>
                              ${historyDate}
                            </span>

                            <strong>
                              ${historyHome}
                              -
                              ${historyAway}
                            </strong>

                            <span>
                              ${historyScore}
                            </span>

                            <span>
                              ${item.label}: ${result}
                            </span>

                          </div>
                        `;

                      }).join('')
                    : `
                      <div class="today-history-empty">
                        Geçmiş eşleşme bulunamadı.
                      </div>
                    `
                }

              </div>

            </div>
          `;

        }).join('')
      : `
        <div class="today-no-stat">
          Bu maç için eşleşen geçmiş istatistik bulunamadı.
        </div>
      `;


    return `
      <div class="today-match-card">

        <div class="today-match-header">

          <div class="today-match-info">

            <div class="today-match-date">
              ${formatTodayDate(getDate(match))}
            </div>

            <div class="today-teams">
              <strong>${home}</strong>
              <span>-</span>
              <strong>${away}</strong>
            </div>

          </div>

        </div>

        <div class="today-results">

          ${
            recommendationHtml
          }

        </div>

      </div>
    `;

  }).join('');
}


/* =========================================================
   GEÇMİŞ MAÇLARI AÇ / KAPAT
   ========================================================= */

function toggleTodayHistory(id, button) {

  const element = document.getElementById(id);

  if (!element) {
    return;
  }

  const isOpen =
    element.style.display !== 'none';

  if (isOpen) {

    element.style.display = 'none';

    if (button) {
      button.textContent = '+';
      button.setAttribute('aria-expanded', 'false');
    }

  } else {

    element.style.display = 'block';

    if (button) {
      button.textContent = '−';
      button.setAttribute('aria-expanded', 'true');
    }
  }
}


/* =========================================================
   BAŞLAT
   ========================================================= */

document.addEventListener('DOMContentLoaded', function () {

  initTodayDatePicker();

  renderToday();

});
</script>
