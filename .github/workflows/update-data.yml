name: Excel verisini data.js'e aktar

on:
  workflow_dispatch:
  push:
    paths:
      - "input/*.xlsx"
      - "scripts/excel_to_data.py"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Excel kütüphanesini kur
        run: python -m pip install openpyxl

      - name: data.js oluştur
        run: python scripts/excel_to_data.py input/acilis.xlsx data.js

      - name: data.js değişikliğini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js

          if git diff --cached --quiet; then
            echo "data.js değişmedi."
            exit 0
          fi

          git commit -m "Excel verisini data.js'e güncelle"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done

          echo "data.js push işlemi başarısız."
          exit 1
